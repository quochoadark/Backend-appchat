spring.application.name=appchatbackend

# MongoDB Configuration (Externalized to .env)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/appchat}

logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO

# JWT Security Configuration (Externalized to .env)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# Redis Configuration (Externalized to .env)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000

# Upload Config
upload.dir=${UPLOAD_DIR:uploads}
upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=${SERVER_PORT:8080}

# Ngrok Config
ngrok.public-url=${NGROK_PUBLIC_URL:}

version: '3.8'

# Note: Main full-stack orchestration is located at project root (../../docker-compose.yml)
services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-appchat
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-rootadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-SecureMongoPassword2026!}
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: redis-appchat
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-SecureRedisPassword2026!}"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  mongodb_data:
